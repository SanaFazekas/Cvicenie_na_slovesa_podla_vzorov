<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cvičenie zo slovenských slovies</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .level-section {
            background: #ffffff;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        /* 2. szint rácsszerkezet: 2 oszlop egymás mellett */
        .grid-container-level2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .verb-card {
            background: #f9fbfc;
            border: 1px solid #e1e8ed;
            padding: 15px;
            border-radius: 6px;
        }
        .verb-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2980b9;
            text-align: center;
            font-size: 1.1em;
        }
        /* Kétoszlopos elrendezés a névmásoknak és mezőknek a szó alatt */
        .conjugation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .pronoun-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9em;
        }
        .row-item span {
            font-weight: 600;
            margin-right: 5px;
            color: #34495e;
        }
        input[type="text"] {
            width: 65%;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9em;
        }
        input.correct {
            border-color: #27ae60;
            background-color: #eafaf1;
        }
        input.incorrect {
            border-color: #c0392b;
            background-color: #fnfdfe;
            background-color: #fdedec;
        }
        .btn-check {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-check:hover {
            background-color: #219653;
        }
        .score {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <h1>Slovenské slovesá - Cvičenie</h1>

    <!-- 2. SZINT -->
    <div class="level-section">
        <h2>2. Úroveň: Časovanie slovies</h2>
        <div class="grid-container-level2" id="level2-container">
            <!-- Dinamikusan generálva JavaScripttel (8 szó -> 4 sor) -->
        </div>
        <button class="btn-check" onclick="checkLevel2()">Skontrolovať 2. úroveň</button>
        <div class="score" id="score2"></div>
    </div>

    <!-- 3. SZINT -->
    <div class="level-section">
        <h2>3. Úroveň: Pokročilé časovanie (plurál / špeciálne tvary)</h2>
        <div id="level3-container">
            <div class="verb-card" style="max-width: 400px; margin: 0 auto;">
                <div class="verb-title">utekať (oni / ony)</div>
                <div style="text-align: center;">
                    <label>Vyber správny tvar: </label>
                    <input type="text" id="l3-input" placeholder="napíš sem...">
                </div>
            </div>
        </div>
        <button class="btn-check" onclick="checkLevel3()" style="max-width: 400px; display: block; margin: 15px auto 0 auto;">Skontrolovať 3. úroveň</button>
        <div class="score" id="score3"></div>
    </div>

    <script>
        // Adatok a 2. szinthez (Alapigék és helyes ragozott alakok tömbjei)
        // Soronként 2 elem, összesen 8 szó (4 sor)
        const level2Data = [
            {
                infinitiv: "bicyklovať",
                forms: ["bicyklujem", "bicykluješ", "bicykluje", "bicyklujeme", "bicyklujete", "bicyklujú"]
            },
            {
                infinitiv: "pracovať",
                forms: ["pracujem", "pracuješ", "pracuje", "pracujeme", "pracujete", "pracujú"]
            },
            {
                infinitiv: "čítať",
                forms: ["čítam", "čítaš", "číta", "čítame", "čítate", "čítajú"]
            },
            {
                infinitiv: "pisat", // példa kedvéért písat (vagy iné) -> písť
                infinitivShow: "písať",
                forms: ["píšem", "píšeš", "píše", "píšeme", "píšete", "píšu"]
            },
            {
                infinitiv: "govoriť", // slovensky hovoriť
                infinitivShow: "hovoriť",
                forms: ["hovorím", "hovoríš", "hovorí", "hovoríme", "hovoríte", "hovoria"]
            },
            {
                infinitiv: "robiť",
                forms: ["robím", "robíš", "robí", "robíme", "robíte", "robia"]
            },
            {
                infinitiv: "vedieť",
                forms: ["viem", "vieš", "vie", "vieme", "vietep", "vedia".replace('tep', 'te')] // javítva
            },
            {
                infinitiv: "chcieť",
                forms: ["chcem", "chceš", "chce", "chceme", "chcete", "chcú"]
            }
        ];

        const pronounsLeft = ["ja", "ty", "on/ona/ono"];
        const pronounsRight = ["my", "vy", "oni/ony"];

        // 2. szint generálása
        function renderLevel2() {
            const container = document.getElementById("level2-container");
            let html = "";

            level2Data.forEach((item, index) => {
                let showName = item.infinitivShow || item.infinitiv;
                html += `
                    <div class="verb-card">
                        <div class="verb-title">${showName}</div>
                        <div class="conjugation-grid">
                            <!-- Bal oszlop: ja, ty, on/ona/ono -->
                            <div class="pronoun-group">
                `;
                
                for(let i = 0; i < 3; i++) {
                    html += `
                        <div class="row-item">
                            <span>${pronounsLeft[i]}</span>
                            <input type="text" data-verb="${index}" data-form="${i}" autocomplete="off">
                        </div>
                    `;
                }

                html += `
                            </div>
                            <!-- Jobb oszlop: my, vy, oni/ony -->
                            <div class="pronoun-group">
                `;

                for(let i = 3; i < 6; i++) {
                    html += `
                        <div class="row-item">
                            <span>${pronounsRight[i-3]}</span>
                            <input type="text" data-verb="${index}" data-form="${i}" autocomplete="off">
                        </div>
                    `;
                }

                html += `
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 2. szint ellenőrzése
        function checkLevel2() {
            const inputs = document.querySelectorAll("#level2-container input");
            let correctCount = 0;
            let totalCount = inputs.length;

            inputs.forEach(input => {
                let verbIdx = input.getAttribute("data-verb");
                let formIdx = input.getAttribute("data-form");
                let userVal = input.value.trim().toLowerCase();
                let correctVal = level2Data[verbIdx].forms[formIdx].toLowerCase();

                if(userVal === correctVal) {
                    input.classList.add("correct");
                    input.classList.remove("incorrect");
                    correctCount++;
                } else {
                    input.classList.add("incorrect");
                    input.classList.remove("correct");
                }
            });

            document.getElementById("score2").innerText = `Výsledok: ${correctCount} / ${totalCount} správne.`;
        }

        // 3. szint ellenőrzése (Helyes alak: utekajú - rövid u-val!)
        function checkLevel3() {
            const input = document.getElementById("l3-input");
            const val = input.value.trim().toLowerCase();
            const scoreDiv = document.getElementById("score3");

            // Elfogadjuk az utekajú alakot
            if(val === "utekajú") {
                input.classList.add("correct");
                input.classList.remove("incorrect");
                scoreDiv.style.color = "#27ae60";
                scoreDiv.innerText = "Správne! (Pozor na krátke 'u': utekajú)";
            } else {
                input.classList.add("incorrect");
                input.classList.remove("correct");
                scoreDiv.style.color = "#c0392b";
                scoreDiv.innerText = "Nesprávne. Správny tvar je utekajú (s krátkym u).";
            }
        }

        // Oldal betöltésekor futtatás
        window.onload = function() {
            renderLevel2();
        };
    </script>
</body>
</html>
